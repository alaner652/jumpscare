<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反應力極限測試</title>

<style>
body {
    margin: 0;
    background: #1a1a1a;
    color: white;
    font-family: Arial;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    cursor: pointer;
}

#game {
    text-align: center;
}

#target {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 20px auto;
    display: none;
}

#scary-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 9999;
}
</style>

</head>

<body>

<div id="game">
    <h1>反應測試 (<span id="round">1</span>/3)</h1>
    <p id="msg">當綠點變紅時點擊</p>
    <button id="start">開始</button>
    <div id="target"></div>
</div>

<video id="scary-video">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
let round = 1;
let isRed = false;
let locked = false;
let startTime = 0;

let currentTimer = null;

const target = document.getElementById('target');
const msg = document.getElementById('msg');
const startBtn = document.getElementById('start');
const roundText = document.getElementById('round');
const video = document.getElementById('scary-video');

startBtn.onclick = () => {
    startBtn.style.display = 'none';
    nextRound();
};

function nextRound() {
    clearCurrentTimer(); // 👉 清掉舊計時器

    locked = true;
    target.style.display = 'none';
    msg.innerText = "集中注意力...";
    isRed = false;

    showGreen();
}

function showGreen() {
    target.style.display = 'block';
    target.style.background = 'green';
    isRed = false;
    locked = false;

    const waitTime = rand(2000, 5000);

    currentTimer = setTimeout(() => {
        target.style.background = 'red';
        isRed = true;
        startTime = Date.now();
    }, waitTime);
}

target.onclick = () => {
    if (locked) return;

    if (!isRed) {
        failRound();
        return;
    }

    if (round === 3) {
        triggerScare();
        return;
    }

    const reaction = Date.now() - startTime;
    alert(`反應時間: ${reaction} ms`);

    round++;
    roundText.innerText = round;
    nextRound();
};

function failRound() {
    clearCurrentTimer();

    locked = true;
    target.style.display = 'none';
    msg.innerText = "太早了！重新來";

    currentTimer = setTimeout(() => {
        nextRound();
    }, 1000);
}

function triggerScare() {
    clearCurrentTimer();

    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(()=>{});
    }

    video.style.display = 'block';
    video.volume = 1;

    const p = video.play();
    if (p) p.catch(()=>{});

    if (navigator.vibrate) {
        navigator.vibrate([300,100,300,100,600]);
    }
}

function clearCurrentTimer() {
    if (currentTimer) {
        clearTimeout(currentTimer);
        currentTimer = null;
    }
}

function rand(min, max) {
    return Math.random() * (max - min) + min;
}
</script>
</body>
</html>
