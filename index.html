<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反應力測試</title>

<style>
body {
    margin: 0;
    background: #1a1a1a;
    color: white;
    font-family: Arial;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

#game {
    text-align: center;
    max-width: 90vw;
}

#target {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin: 20px auto;
    display: none;
}

#result {
    display: none;
    margin-top: 20px;
    background: #2a2a2a;
    padding: 16px;
    border-radius: 12px;
    white-space: pre-line;
}

#scary-video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    display: none;
    z-index: 9999;
    background: black;
}
</style>
</head>

<body>

<div id="game">
    <h1>反應測試 (<span id="round">1</span>/3)</h1>
    <p id="msg">當綠點變紅時點擊</p>
    <button id="start">開始</button>

    <div id="target"></div>
    <div id="result"></div>
</div>

<video id="scary-video" preload="auto" playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<script>
let round = 1;
let isRed = false;
let locked = false;
let startTime = 0;
let currentTimer = null;

const target = document.getElementById('target');
const msg = document.getElementById('msg');
const startBtn = document.getElementById('start');
const roundText = document.getElementById('round');
const video = document.getElementById('scary-video');
const resultBox = document.getElementById('result');

startBtn.onclick = () => {
    startBtn.style.display = 'none';
    nextRound();
};

function nextRound() {
    clearTimer();

    locked = true;
    target.style.display = 'none';
    msg.innerText = "集中注意力";
    isRed = false;

    showGreen();
}

function showGreen() {
    target.style.display = 'block';
    target.style.background = 'green';
    isRed = false;
    locked = false;

    const waitTime = rand(2000, 5000);

    currentTimer = setTimeout(() => {
        target.style.background = 'red';
        isRed = true;
        startTime = Date.now();
    }, waitTime);
}

target.onclick = () => {
    if (locked) return;

    if (!isRed) {
        failRound();
        return;
    }

    if (round === 3) {
        locked = true;

        requestAnimationFrame(() => {
            triggerScare();
        });

        return;
    }

    const reaction = Date.now() - startTime;

    showResult(reaction);

    round++;
    roundText.innerText = round;

    nextRound();
};

function failRound() {
    clearTimer();

    locked = true;
    target.style.display = 'none';
    msg.innerText = "太早了，重新來";

    currentTimer = setTimeout(() => {
        nextRound();
    }, 1000);
}

function triggerScare() {
    clearTimer();

    video.style.display = 'block';

    requestAnimationFrame(() => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }

        setTimeout(() => {
            video.volume = 1;

            const p = video.play();
            if (p) p.catch(() => {});

            if (navigator.vibrate) {
                navigator.vibrate([300,100,300,100,600]);
            }
        }, 50);
    });
}

function showResult(reaction) {
    const rank = getRank(reaction);
    const leaderboard = buildLeaderboard(reaction);

    let boardText = leaderboard
        .map((p, i) => `${i+1}. ${p.name} - ${p.score}ms`)
        .join("\n");

    resultBox.style.display = 'block';

    resultBox.innerText =
`反應時間: ${reaction} ms

等級: ${rank}

排行榜:
${boardText}`;
}

function getRank(ms) {
    if (ms < 180) return "神經反射等級";
    if (ms < 220) return "專注大師";
    if (ms < 260) return "反應優秀";
    if (ms < 320) return "正常水平";
    return "需要練習";
}

const fakeLeaderboard = [
    { name: "Alex", score: 178 },
    { name: "Chris", score: 192 },
    { name: "Jamie", score: 205 },
    { name: "Taylor", score: 219 }
];

function buildLeaderboard(myScore) {
    return [...fakeLeaderboard, { name: "You", score: myScore }]
        .sort((a,b) => a.score - b.score)
        .slice(0,5);
}

function clearTimer() {
    if (currentTimer) {
        clearTimeout(currentTimer);
        currentTimer = null;
    }
}

function rand(min, max) {
    return Math.random() * (max - min) + min;
}
</script>

</body>
</html>
